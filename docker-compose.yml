version: "3.8"

services:
  agent-microservice:
    build: .
    container_name: agent-microservice
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MAIN_PLATFORM_SECRET=${MAIN_PLATFORM_SECRET:-your_super_secret_webhook_token_here}
      - MAIN_PLATFORM_URL=${MAIN_PLATFORM_URL:-http://localhost:3000/api/agent-response}
      - MAX_OUTPUT_TOKENS=${MAX_OUTPUT_TOKENS:-300}
      - TEMPERATURE=${TEMPERATURE:-0.7}
    volumes:
      # Mount .env file if it exists (for local development)
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - agent-network

  # Optional: Add a simple nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: agent-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent-microservice
    networks:
      - agent-network
    profiles:
      - production

networks:
  agent-network:
    driver: bridge
